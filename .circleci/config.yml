version: 2.1

jobs:
  build:
    docker:
      - image: cimg/go:1.23
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-{{ checksum "go.sum" }}
      - run:
          name: Download dependencies
          command: go mod download
      - save_cache:
          key: go-mod-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod
      - run:
          name: Build application
          command: go build -o myapp
      - run:
          name: Check for vulnerabilities
          command: |
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck ./...
      - persist_to_workspace:
          root: .
          paths:
            - myapp
      - store_artifacts:
          path: myapp

  test:
    docker:
      - image: cimg/go:1.23
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-{{ checksum "go.sum" }}
      - run:
          name: Download dependencies
          command: go mod download
      - run:
          name: Run tests
          command: go test -coverprofile=coverage.out -parallel 4
      - store_test_results:
          path: coverage.out

  deploy_staging:
    docker:
      - image: cimg/go:1.23
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: List workspace contents
          command: ls -l .
      - run:
          name: Deploy to staging
          command: |
            mkdir -p /var/www/myapp && cp /workspace/myapp /var/www/myapp
            ###ssh ${STAGING_USER}@${STAGING_SERVER} "mkdir -p /var/www/myapp && cp . /var/www/myapp"

workflows:
  build-test-and-deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy_staging:
          requires:
            - test
          ###filters:
            ###branches:
              ###only:
                ###- main
