version: 2.1

jobs:
  build:
    docker:
      - image: cimg/go:1.23 # Go 1.20 を使用
    steps:
      - checkout

      - restore_cache: # 依存関係キャッシュの復元
          keys:
            - go-mod-{{ checksum "go.sum" }}

      - run:
          name: Download dependencies
          command: go mod download

      - save_cache: # 依存関係キャッシュの保存
          key: go-mod-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod

      - run:
          name: Build application
          command: go build -o myapp

      - store_artifacts: # ビルド成果物の保存
          path: myapp

  test:
    needs: build # build ジョブ完了後に実行
    docker:
      - image: cimg/go:1.23
    steps:
      - checkout

      - restore_cache: # 依存関係キャッシュの復元
          keys:
            - go-mod-{{ checksum "go.sum" }}

      - run:
          name: Download dependencies
          command: go mod download

      - run:
          name: Run tests
          command: go test ./... -coverprofile=coverage.out -parallel 4 # 並列数: 4 (調整可能)

      - store_test_results: # テスト結果の保存
          path: coverage.out

  deploy-staging: # ステージング環境へのデプロイ
    needs: test # test ジョブ完了後に実行
    environment: staging # 環境名
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - attach_workspace: # ビルド成果物 (myapp) をアタッチ
          at: /tmp/workspace
      - run:
          name: Deploy to staging
          command: |
            # デプロイコマンド (例: ssh, rsync など)
            # 環境変数 STAGING_SERVER, STAGING_USER などを使用
            ssh ${STAGING_USER}@${STAGING_SERVER} "mkdir -p /var/www/myapp && cp /tmp/workspace/myapp /var/www/myapp"

workflows:
  build-test-and-deploy: # ワークフロー名
    jobs:
      - build
      - test:
          requires: build # build ジョブ完了後に実行
      - deploy-staging:
          requires: test # test ジョブ完了後に実行
          filters: # 特定ブランチでのみデプロイ
            branches:
              only:
                - main # main ブランチのみ
